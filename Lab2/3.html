<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter Number"));
        let b=0;
        let temp = 1;
        let fibo=0;
        document.write(b,",");
        document.write(temp);
        for (let index = 0; index < a; index++) {
            fibo=temp+b;
            document.write(","+fibo);
            b=temp;
            temp=fibo;
        }    
    </script>
</body>
</html>
