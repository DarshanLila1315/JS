<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = prompt("Enter String");
        let rev = a.split("").reverse().join("");
        if(a== rev){
            document.write("It's palindrome");
        }
        else{
            document.write("its not palindrome")
        }
    </script>
</body>
</html>
