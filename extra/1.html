 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <p id =display></p>
    <script>
        let n1 = prompt("Enter a number:");
        for(let i= 1 ; i <=n1 ;i++){
            if(n1 %i == 0){
                document.getElementById("display").innerHTML += i + "<br>";
            }
        }
    </script>
 </body>
 </html>
