<!-- Armstrong Number -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number</title>
</head>
<body>
    <p id="display"></p>
    <script>
        let num = prompt("Enter a number:");
        let sum = 0;
        let temp = num;
        if()
        while (temp > 0) {
            let digit = temp % 10;
            sum += digit ** 3;
            temp = Math.floor(temp / 10);
        }
        if (sum == num) {
            document.getElementById("display").innerHTML = num + " is an Armstrong number.";
        } else {
            document.getElementById("display").innerHTML = num + " is not an Armstrong number.";
        }
    </script>
</body>
</html>
