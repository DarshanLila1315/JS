<!-- Write a program to display the current date and time, updating every second using setInterval() -->
 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="pDateTime"></p>
    <button id="stop" onclick="stop()"></button>
    <script>
        setInterval(() => {
            let date = new Date();
            document.getElementById("pDateTime").innerHTML = date.toLocaleTimeString();
         }, 1000);
    </script>
</body>

</html>
