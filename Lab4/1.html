<!-- Write a program to change the text and background color of a paragraph on button click. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <p id="col">Hello</p>
    <button onclick="changeColors()">Click</button>
    <script>
        function changeColors() {
            var a = document.getElementById("col");
            a.style.color = "white"; 
            a.style.backgroundColor = "red";
        }
    </script>
 </body>

 </html>
