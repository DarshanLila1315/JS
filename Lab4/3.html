<!-- Write a program to perform addition, subtraction, multiplication, and division using DOM input fields and buttons. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
 </head>
 <body>
    <input type="number" id="num1" placeholder="Enter first number"><br>
    <input type="number" id="num2" placeholder="Enter second number"><br>
    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <p id="result">Result: </p>
    <script>
        function add() {
            var a = parseFloat(document.getElementById("num1").value);
            var b = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").innerText = "Result: " + (a + b);
        }

        function subtract() {
            var a = parseFloat(document.getElementById("num1").value);
            var b = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").innerText = "Result: " + (a - b);
        }

        function multiply() {
            var a = parseFloat(document.getElementById("num1").value);
            var b = parseFloat(document.getElementById("num2").value);
            document.getElementById("result").innerText = "Result: " + (a * b);
        }

        function divide() {
            var a = parseFloat(document.getElementById("num1").value);
            var b = parseFloat(document.getElementById("num2").value);
            if (b !== 0) {
                document.getElementById("result").innerText = "Result: " + (a / b);
            } else {
                document.getElementById("result").innerText = "Error: Division by zero";
            }
        }
    </script>
 </body>
 </html>
